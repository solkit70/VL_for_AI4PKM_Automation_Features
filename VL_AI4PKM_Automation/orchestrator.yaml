version: "1.0"
orchestrator:
  prompts_dir: _Settings_/Prompts
  tasks_dir: _Settings_/Tasks
  logs_dir: _Settings_/Logs
  skills_dir: _Settings_/Skills
  bases_dir: _Settings_/Bases
  max_concurrent: 3
  poll_interval: 1
  executors:
    claude_code:
      command: C:\Users\dougg\AppData\Roaming\npm\claude.cmd
    gemini:
      command: C:\Users\dougg\AppData\Roaming\npm\gemini.cmd
defaults:
  executor: claude_code
  timeout_minutes: 30
  max_parallel: 3
  task_create: true
  task_priority: medium
  task_archived: false
nodes:
  - type: agent
    name: Enrich Ingested Content (EIC)
    abbreviation: eic
    executor: claude_code
    input_path: vl_ai4pkm_clippings
    output_path: vl_ai4pkm_materials
    output_type: new_file
    enabled: false
  - type: agent
    name: Create Thread Postings (CTP)
    abbreviation: ctp
    executor: claude_code
    input_path:
      - vl_ai4pkm_materials
      - 01-AI4PKM_CLI_Structure
      - 02-Basic_Commands
    output_path: Publish
id: VL_AI4PKM_Automation
name: VL_AI4PKM_Automation
