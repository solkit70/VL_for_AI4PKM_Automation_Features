# AI4PKM Orchestrator Configuration
# Centralized input/output routing for all agents
version: "1.0"

# Orchestrator runtime settings
orchestrator:
  prompts_dir: "_Settings_/Prompts"
  tasks_dir: "_Settings_/Tasks"
  logs_dir: "_Settings_/Logs"
  skills_dir: "_Settings_/Skills"
  bases_dir: "_Settings_/Bases"
  max_concurrent: 3
  poll_interval: 1.0

  # Windows executor paths (from ai4pkm_cli.json)
  executors:
    claude_code:
      command: "C:\\Users\\dougg\\AppData\\Roaming\\npm\\claude.cmd"
    gemini:
      command: "C:\\Users\\dougg\\AppData\\Roaming\\npm\\gemini.cmd"

# Global defaults for all agents
defaults:
  executor: claude_code
  timeout_minutes: 30
  max_parallel: 3  # Allow 3 concurrent executions
  task_create: true
  task_priority: medium
  task_archived: false

nodes:
  # Enrich Ingested Content
  - type: agent
    name: Enrich Ingested Content (EIC)
    abbreviation: "eic"
    executor: claude_code
    input_path: vl_ai4pkm_clippings
    output_path: vl_ai4pkm_materials
    output_type: new_file  # Create new files in vl_ai4pkm_materials

  # Create Thread Postings
  - type: agent
    name: Create Thread Postings (CTP)
    abbreviation: "ctp"
    executor: claude_code
    input_path:
      - vl_ai4pkm_materials
      - 01-AI4PKM_CLI_Structure
      - 02-Basic_Commands
    output_path: Publish

  # Batch workflow support is TBA
